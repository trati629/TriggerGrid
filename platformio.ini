; TriggerGrid — PlatformIO project configuration
; Board: Guition JC3248W535 (ESP32-S3, 16 MB flash, 8 MB OPI PSRAM)
; Board details and known quirks: docs/hardware/jc3248w535.md

[platformio]
default_envs = guition-jc3248w535

[env:guition-jc3248w535]
; pioarduino (Arduino core 3.x) is required. The default `espressif32`
; platform ships core 2.x and the GFX library will not compile against it.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.arduino.memory_type = qio_opi   ; OPI PSRAM
board_build.flash_mode = dio                ; qio can fail to boot on some units
board_build.filesystem = littlefs           ; config.json lives here
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB              ; devkitc-1 defaults to 8MB; must match the partition table
board_build.f_cpu = 240000000L

; Gzips web/ into src/web/web_assets.h before every build, so one upload
; updates the firmware and its web page together.
extra_scripts = pre:tools/embed_web.py

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Let LVGL find include/lv_conf.h
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.0
    lvgl/lvgl @ ~9.6.0   ; pinned to a minor version so milestone tags stay reproducible
    h2zero/NimBLE-Arduino @ ^2.1.0
    bblanchon/ArduinoJson @ ^7.0.0

; Unit tests that run on the PC: `pio test -e native`.
; Only the plain C++ parts of the firmware are built here (no Arduino APIs).
[env:native]
platform = native
build_flags = -std=gnu++17 -I include -I src
build_src_filter = -<*> +<config/pad_parse.cpp> +<config/defaults.cpp>
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
