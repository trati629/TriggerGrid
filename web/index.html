<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TriggerGrid</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="brand-mark"><i></i><i></i><i></i><i></i></span>TriggerGrid</div>
    <div class="chips" id="chips"></div>
    <div class="spacer"></div>
    <span class="dirty" id="dirty"><span class="dot"></span>Unsaved changes</span>
    <button class="btn primary" id="save" disabled>Save to device</button>
  </header>
  <main id="main">
    <nav class="sidebar" id="sidebar"></nav>
    <section class="stage" id="stage"></section>
    <aside class="editor" id="editor"></aside>
  </main>
</div>
<div class="toast" id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<!-- The layout compiler and its tables (also used by web/test.html). -->
<script src="lib/swatches.js"></script>
<script src="lib/icons.js"></script>
<script src="lib/keymap.js"></script>
<script src="lib/layouts/us.js"></script>
<script src="lib/unicode.js"></script>
<script src="lib/validate.js"></script>
<script src="lib/compile.js"></script>
<script src="lib/default-layout.js"></script>
<script src="app.js"></script>
</body>
</html>
